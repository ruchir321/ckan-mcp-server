[project]
name = "ckan-mcp-server"
version = "1.2.0"
description = "A Model Context Protocol (MCP) server for the CKAN API that enables browsing and managing CKAN data portals through MCP-compatible clients."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Ruchir Attri", email = "ruchir.attri99@gmail.com" },
    { name = "Ondics GmbH", email = "info@ondics.de" },
]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.14.1,<4",
    "beautifulsoup4>=4.15.0,<5",
    "certifi>=2026.6.17",
    "fastmcp>=3.4.4,<4",
    "markdownify>=1.2.3,<2",
    "pypdf>=6.14.2,<7",
    "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "aioresponses>=0.7.9,<0.8",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.15.22,<0.16",
]

[project.scripts]
ckan-mcp-server = "ckan_mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/ruchir321/ckan-mcp-server"
Issues = "https://github.com/ruchir321/ckan-mcp-server/issues"
Discussions = "https://github.com/ruchir321/ckan-mcp-server/discussions"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ckan_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_ckan_*.py", "test_web_document.py"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
