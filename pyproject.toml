[project]
name = "ckan-mcp-server"
version = "1.2.0"
description = "A Model Context Protocol (MCP) server for the CKAN API that enables browsing and managing CKAN data portals through MCP-compatible clients."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ruchir Attri", email = "ruchir.attri99@gmail.com" },
    { name = "Ondics GmbH", email = "info@ondics.de" },
]
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "certifi",
    "fastmcp>=2.0",
    "markdownify>=0.11",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]
# Civic-answer agent + Langfuse eval harness (see agent/ and evals/).
agent = [
    "anthropic>=0.40",
    "langfuse>=3",
    "pyyaml>=6",
]

[project.scripts]
ckan-mcp-server = "mcp_ckan_server:main"

[project.urls]
Homepage = "https://github.com/ruchir321/ckan-mcp-server"
Issues = "https://github.com/ruchir321/ckan-mcp-server/issues"
Discussions = "https://github.com/ruchir321/ckan-mcp-server/discussions"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_ckan_server", "document_scraper"]
packages = ["agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_ckan_*.py", "test_web_document.py", "test_civic_agent.py"]

[tool.uv]
package = true
