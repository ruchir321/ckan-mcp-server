services:
  ckan-mcp-server-stdio:
    profiles: [stdio]
    build: .
    environment:
      CKAN_URL: ${CKAN_URL}
      CKAN_API_KEY: ${CKAN_API_KEY:-}
    stdin_open: true
    tty: true

  ckan-mcp-server:
    profiles: [http]
    build: .
    environment:
      CKAN_URL: ${CKAN_URL}
      CKAN_API_KEY: ${CKAN_API_KEY:-}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
    ports:
      - "8000:8000"
